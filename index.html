<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Zero Fugas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Zero Fugas">
<style>
  html,body{margin:0;height:100%;background:#0f1115;color:#eef0f4;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;pointer-events:none;transition:opacity .25s}
  #app.on{opacity:1;pointer-events:auto}
  #panel{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
  #panel.off{display:none}
  #panel img{width:84px;height:84px}
  h1{font-size:22px;margin:0}
  .sub{color:#8b919e;font-size:14px;max-width:340px}
  input{width:100%;max-width:360px;box-sizing:border-box;background:#171a21;color:#eef0f4;border:1px solid #272b35;border-radius:12px;padding:12px;font-size:16px}
  .btn{display:inline-block;padding:12px 20px;border-radius:12px;border:0;background:#eef0f4;color:#0f1115;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;font-family:inherit}
  .btn.sec{background:none;color:#eef0f4;border:1px solid #272b35}
  .spin{width:30px;height:30px;border:3px solid #272b35;border-top-color:#eef0f4;border-radius:50%;animation:g .8s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  .hidden{display:none!important}
</style>
</head>
<body>
  <div id="panel">
    <img src="icon-192.png" alt="">
    <h1>Zero Fugas</h1>
    <div id="cargando"><div class="spin"></div></div>
    <div id="msg" class="sub">Cargando…</div>

    <div id="config" class="hidden" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:12px">
      <input id="link" type="url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec" aria-label="Link de tu app">
      <button class="btn" id="guardar">Guardar link</button>
    </div>

    <div id="instalar" class="hidden" style="display:flex;flex-direction:column;align-items:center;gap:10px">
      <button class="btn" id="btnInstalar" style="display:none">📲 Instalar app</button>
      <div id="pasos" class="sub"></div>
      <button class="btn sec" id="sinInstalar">Abrir sin instalar</button>
    </div>

    <div id="fallo" class="hidden" style="display:flex;flex-direction:column;align-items:center;gap:10px">
      <a class="btn" id="directo" target="_self">Abrir e iniciar sesión</a>
      <button class="btn sec" id="reintentar">Reintentar</button>
    </div>
  </div>

  <iframe id="app" title="Zero Fugas" allow="clipboard-write"></iframe>

<script>
  // El link de tu app (el que termina en /exec) se guarda solo en este celular, no en GitHub.
  const CLAVE = 'zero-fugas-url';
  const $ = id => document.getElementById(id);
  const leer = () => { try { return localStorage.getItem(CLAVE) || ''; } catch (e) { return ''; } };
  const guardar = v => { try { localStorage.setItem(CLAVE, v); } catch (e) {} };
  // Acepta cuentas personales (/macros/s/…/exec) y de empresa (/a/macros/dominio/s/…/exec)
  const valido = u => /^https:\/\/script\.google\.com\/(a\/macros\/[^/]+|macros)\/s\/[\w-]+\/exec/.test(u);
  function limpiar(u) {
    u = (u || '').trim().replace(/^<|>$/g, '');
    if (/^AKfy[\w-]{20,}$/.test(u)) u = 'https://script.google.com/macros/s/' + u + '/exec'; // pegaron solo el ID
    u = u.replace(/^http:\/\//, 'https://');
    return u.split('#')[0];
  }

  // Modo 'directo': abre tu app de Google en la misma ventana (funciona siempre, con tu sesión normal).
  const MODO = 'zero-fugas-modo';
  const modo = () => { try { return localStorage.getItem(MODO) || ''; } catch (e) { return ''; } };
  const setModo = v => { try { localStorage.setItem(MODO, v); } catch (e) {} };

  if (new URLSearchParams(location.search).has('reset')) {
    try { localStorage.removeItem(CLAVE); localStorage.removeItem(MODO); } catch (e) {}
    history.replaceState(null, '', location.pathname);
  }

  // ¿Se abrió desde el ícono instalado o desde el navegador?
  const instalada = () => matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: minimal-ui)').matches || navigator.standalone === true;
  let promptInstalar = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); promptInstalar = e; $('btnInstalar').style.display = ''; });
  window.addEventListener('appinstalled', () => { $('btnInstalar').style.display = 'none'; $('pasos').textContent = '¡Listo! Ya la tienes instalada. Ábrela desde el ícono ⚡ de tu pantalla.'; });

  function ofrecerInstalar(url) {
    $('sinInstalar').onclick = () => irDirecto(url);
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    $('pasos').innerHTML = (promptInstalar ? 'O también: ' : '') + (ios
      ? 'En Safari toca <b>Compartir</b> (el cuadrito con flecha) → <b>Agregar a inicio</b>.'
      : 'En Chrome toca el menú <b>⋮</b> → <b>Instalar app</b> o <b>Agregar a pantalla principal</b>. En el computador, el ícono de instalar aparece en la barra de direcciones.');
    $('btnInstalar').style.display = promptInstalar ? '' : 'none';
    estado('instalar', 'Instala Zero Fugas en tu pantalla. Después ábrela siempre desde el ícono ⚡ y entrará directo.');
  }
  $('btnInstalar').onclick = async () => {
    if (!promptInstalar) return;
    promptInstalar.prompt();
    try { await promptInstalar.userChoice; } catch (e) {}
    promptInstalar = null; $('btnInstalar').style.display = 'none';
  };

  function irDirecto(url) {
    estado('cargando', 'Abriendo Zero Fugas…');
    location.replace(url); // sin dejar rastro en el historial: "atrás" cierra la app
  }

  let timer = null;
  function estado(cual, texto) {
    $('cargando').classList.toggle('hidden', cual !== 'cargando');
    $('config').classList.toggle('hidden', cual !== 'config');
    $('fallo').classList.toggle('hidden', cual !== 'fallo');
    $('instalar').classList.toggle('hidden', cual !== 'instalar');
    $('msg').textContent = texto;
  }

  function pedirLink() {
    $('panel').classList.remove('off'); $('app').classList.remove('on');
    estado('config', 'Pega una sola vez el link de tu app (Apps Script → Implementar → Gestionar implementaciones). Queda guardado en este celular.');
  }

  function abrir() {
    const url = leer();
    if (!valido(url)) return pedirLink();
    if (!navigator.onLine) return estado('fallo', 'Sin internet. Conéctate y toca Reintentar.');
    $('directo').href = url;
    $('panel').classList.remove('off'); $('app').classList.remove('on');
    if (modo() === 'directo') return instalada() ? irDirecto(url) : ofrecerInstalar(url);
    estado('cargando', 'Cargando…');
    $('app').src = url;
    clearTimeout(timer);
    // Si Google no deja abrirla por dentro, se cambia sola a modo directo y lo recuerda.
    timer = setTimeout(() => { setModo('directo'); instalada() ? irDirecto(url) : ofrecerInstalar(url); }, 8000);
  }

  window.addEventListener('message', e => {
    let host = '';
    try { host = new URL(e.origin).hostname; } catch (er) {}
    if (e.data === 'zero-fugas-ok' && (host.endsWith('.googleusercontent.com') || host === 'script.google.com')) {
      clearTimeout(timer); setModo('dentro');
      $('app').classList.add('on'); $('panel').classList.add('off');
    }
  });

  $('guardar').onclick = () => {
    const u = limpiar($('link').value);
    if (!valido(u)) {
      $('msg').textContent = /\/dev(\?|$)/.test(u)
        ? 'Ese es el link de prueba (/dev). Usa el de "Gestionar implementaciones", que termina en /exec.'
        : 'Ese link no parece el de tu app. Cópialo en Apps Script → Implementar → Gestionar implementaciones → URL de la aplicación web (termina en /exec).';
      return;
    }
    guardar(u); abrir();
  };
  $('reintentar').onclick = abrir;
  window.addEventListener('online', () => { if (!$('app').classList.contains('on')) abrir(); });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  abrir();
</script>
</body>
</html>
